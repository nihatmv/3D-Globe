<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Remote Job Globe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%230e1118' stroke='%233987e5' stroke-width='3'/><circle cx='20' cy='12' r='3' fill='%23d95926'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="globe" aria-label="Globe of remote job postings by company headquarters"></div>

    <header class="hud">
      <nav class="pages" aria-label="Pages">
        <a href="/" aria-current="page">Job globe</a>
        <a href="/day-night.html">Day &amp; night</a>
      </nav>
      <h1>Remote Job Globe</h1>
      <p class="sub">Remote tech postings, placed at each company's headquarters.</p>
      <dl class="stats" id="stats"></dl>
      <nav class="top" aria-label="Largest hubs">
        <span class="top-label">Top hubs</span>
        <div id="top-cities"></div>
      </nav>
    </header>

    <aside class="legend" aria-label="Legend">
      <div><span class="dot dot-text"></span>HQ stated in the posting</div>
      <div><span class="dot dot-inferred"></span>HQ inferred from the company</div>
      <div><span class="dot dot-approx"></span>Region or country only (no city)</div>
      <div class="legend-note">Height and size = number of jobs</div>
    </aside>

    <aside class="panel" id="panel" aria-live="polite" hidden>
      <div class="panel-head">
        <div>
          <h2 id="panel-title"></h2>
          <p id="panel-sub"></p>
        </div>
        <button class="close" id="panel-close" aria-label="Close">×</button>
      </div>
      <ol class="jobs" id="panel-jobs"></ol>
    </aside>

    <div class="status" id="status">Loading globe data…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
